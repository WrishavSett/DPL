<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Camera Counting Console{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">CAM<span>COUNT</span></div>
      <nav class="tabs">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Cameras</a>
        <a href="/manage" class="{{ 'active' if request.url.path == '/manage' else '' }}">Manage</a>
        <a href="/visualization" class="{{ 'active' if request.url.path == '/visualization' else '' }}">Visualization</a>
        <a href="/reports" class="{{ 'active' if request.url.path == '/reports' else '' }}">Reports</a>
      </nav>
      <div class="fleet-summary" id="fleet-summary">&mdash; / &mdash; online</div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', path='js/status_socket.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>

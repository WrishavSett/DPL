{% extends "base.html" %}

{% block title %}Reports — Camera Counting Console{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Hourly Reports</h1>
    <div class="sub">Classwise counts per camera, aggregated by hour.</div>
  </div>
  <button id="generate-now" class="primary">Generate for current hour</button>
</div>

<table>
  <thead>
    <tr>
      <th>Report</th>
      <th>Period start</th>
      <th>Period end</th>
      <th>Generated at</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="reports-table-body">
    <tr><td colspan="5" class="text-muted">Loading…</td></tr>
  </tbody>
</table>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', path='js/tab4_reports.js') }}"></script>
{% endblock %}
